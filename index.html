<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Footy App</title>
  <meta name="description" content="Footy ladder, fixture and live scores. Unofficial and ad-free.">
  <style>
    :root {
      --bg: #F4EFE3; --surface: #FBF8F0; --text: #1A1A1A; --muted: #5B5446;
      --navy: #0B2D72; --red: #D7182A; --link: #D7182A; --border: #1A1A1A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0A1630; --surface: #0F1D3F; --text: #F4EFE3; --muted: #B9B2A2;
        --navy: #050C1E; --link: #FF5A5F; --border: #2C4A8C;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header { background: var(--navy); border-bottom: 4px solid var(--red); padding: 12px 16px; }
    header p { margin: 0 auto; max-width: 640px; color: #FFFFFF; font-weight: 800; font-size: 20px; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 {
      font-size: 34px; line-height: 1.1; margin: 0 0 12px; text-transform: uppercase;
      font-style: italic; display: inline-block; border-bottom: 5px solid var(--red);
    }
    .lead { font-size: 20px; margin: 0 0 24px; }
    .box { background: var(--surface); border: 2px solid var(--border); padding: 16px; margin: 0 0 24px; }
    .box p { margin: 0; }
    a { color: var(--link); }
    ul { padding-left: 20px; }
    li { margin: 6px 0; }
    footer { color: var(--muted); font-size: 15px; }
  </style>
</head>
<body>
  <header><p>The Footy App</p></header>
  <main>
    <h1>The Footy App</h1>
    <p class="lead">Footy ladder, fixture and live scores. Unofficial and ad-free.</p>

    <div class="box">
      <p><strong>Unofficial app.</strong> Not affiliated with, endorsed by, or connected to the AFL or any AFL club.</p>
    </div>

    <ul>
      <li><a href="privacy.html">Privacy policy</a></li>
      <li>Support: <a href="mailto:thefootyappemail@gmail.com">thefootyappemail@gmail.com</a></li>
    </ul>

    <footer>
      <p>Football data from the <a href="https://squiggle.com.au">Squiggle API</a>.</p>
    </footer>
  </main>
</body>
</html>
